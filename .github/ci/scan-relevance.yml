# Mobile scanner path policy. Empty Alpha-only families preserve the shared helper schema.
# D: product, deployment, credential and Sonar routing remains in Concord-Voice/Concord-Voice-Alpha.

all_changed:
  - '**'

codeql_actions:
  - '.github/scripts/verify-pr-scan-results.py'
  - '.github/workflows/required-pr-build.yml'
  - '.github/workflows/*.{yml,yaml}'
  - '.github/actions/**/*.{yml,yaml}'
  - '**/action.{yml,yaml}'
  - '.github/codeql/**'
  - '.github/queries/**'
  - '.github/workflows/codeql.yml'
  - '.github/ci/scan-relevance.yml'
  - '.github/scripts/ci-scan-relevance.mjs'
  - '.github/workflows/pr-ci.yml'

codeql_go: []

codeql_js:
  - '.github/scripts/verify-pr-scan-results.py'
  - '.github/workflows/required-pr-build.yml'
  - '**/*.{js,jsx,mjs,cjs,es,es6,ts,tsx,mts,cts,htm,html,xhtm,xhtml,vue,hbs,ejs,njk,json,yaml,yml,raml,xml}'
  - '**/package.json'
  - '**/*lock*'
  - '**/tsconfig*.json'
  - '**/vite.config.*'
  - '**/webpack.config.*'
  - '.github/codeql/**'
  - '.github/queries/**'
  - '.github/workflows/codeql.yml'
  - '.github/ci/scan-relevance.yml'
  - '.github/scripts/ci-scan-relevance.mjs'
  - '.github/workflows/pr-ci.yml'

eslint:
  - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
  - 'package.json'
  - 'package-lock.json'
  - '.eslintrc.js'
  - '.eslintignore'
  - 'tsconfig*.json'
  - '.github/workflows/eslint-sarif.yml'
  - '.github/ci/scan-relevance.yml'
  - '.github/scripts/ci-scan-relevance.mjs'
  - '.github/workflows/pr-ci.yml'
  - '.github/scripts/verify-pr-scan-results.py'
  - '.github/workflows/required-pr-build.yml'
  - '!scripts/**'
  - '!.semgrep/**'
  - '!node_modules/**'
  - '!.github/tools/**'

govulncheck: []

osv:
  - '.github/scripts/verify-pr-scan-results.py'
  - '.github/workflows/required-pr-build.yml'
  - '**/{conan.lock,pubspec.lock,mix.lock,go.mod,go.sum,cabal.project.freeze,stack.yaml.lock,buildscript-gradle.lockfile,gradle.lockfile,gradle/verification-metadata.xml,pom.xml,bun.lock,package.json,package-lock.json,pnpm-lock.yaml,yarn.lock,deps.json,packages.config,packages.lock.json,composer.lock,Pipfile.lock,poetry.lock,requirements.txt,pdm.lock,pylock.toml,uv.lock,renv.lock,Gemfile.lock,gems.locked,Cargo.lock,osv-scanner-custom.json}'
  - '**/*.{spdx.json,spdx,spdx.yml,spdx.rdf,spdx.rdf.xml,cdx.json,cdx.xml}'
  - '**/{bom.json,bom.xml}'
  - '**/*.go'
  - '**/*.{c,cc,cpp,cxx,h,hh,hpp,hxx}'
  - '.gitmodules'
  - '**/.gitmodules'
  - '**/osv-scanner.toml'
  - '.gitignore'
  - '.github/workflows/osv-scanner.yml'
  - '.github/scripts/validate-osv-push-provenance.sh'
  - '.github/ci/scan-relevance.yml'
  - '.github/scripts/ci-scan-relevance.mjs'
  - '.github/workflows/pr-ci.yml'

semgrep_custom:
  - '.github/scripts/verify-pr-scan-results.py'
  - '.github/workflows/required-pr-build.yml'
  - '**/*.{go,js,jsx,mjs,cjs,ts,tsx,mts,cts}'
  - '.semgrep/**'
  - '.semgrepignore'
  - '.github/workflows/semgrep.yml'
  - '.github/ci/scan-relevance.yml'
  - '.github/scripts/ci-scan-relevance.mjs'
  - '.github/workflows/pr-ci.yml'

semgrep_community:
  - '.github/scripts/verify-pr-scan-results.py'
  - '.github/workflows/required-pr-build.yml'
  - '**'
  - '!**/*_test.go'
  - '!**/tests/fixtures/**'
  - '!scripts/fixtures/**'
  - '!.semgrep/tests/**'
  - '.semgrepignore'
  - '.github/workflows/semgrep.yml'
  - '.github/ci/scan-relevance.yml'
  - '.github/scripts/ci-scan-relevance.mjs'
  - '.github/workflows/pr-ci.yml'

semgrep_canary:
  - '.github/scripts/verify-pr-scan-results.py'
  - '.github/workflows/required-pr-build.yml'
  - '.github/workflows/*.{yml,yaml}'
  - '.github/actions/**/*.{yml,yaml}'
  - '**/action.{yml,yaml}'
  - '.semgrep/tests/action-ref-canary.test.yaml'
  - '.semgrepignore'
  - '.semgrep/**'
  - '.github/scripts/tests/semgrep-action-ref-canary*'
  - '.github/ci/scan-relevance.yml'
  - '.github/scripts/ci-scan-relevance.mjs'
  - '.github/workflows/pr-ci.yml'

