# Mobile app tests with coverage, for SonarCloud. Called by pr-ci.yml (PR and
# protected ruleset runs) and sonar-main.yml (daily main analysis).
#
# N: Alpha's build.yml has no Mobile lane. This is the Mobile equivalent of its
# desktop coverage producer. The shared selection and verifier contracts key
# app coverage as `desktop`, so the artifact keeps the `desktop-coverage` name
# (verify-pr-scan-results.py derives `<component>-coverage`), and the job name
# is the producer prepare-protected-pr-analysis.py expects.
name: Build

on:
  workflow_call:
    outputs:
      desktop-coverage:
        description: "true when the Mobile app coverage artifact was uploaded"
        value: ${{ jobs.mobile.outputs.coverage }}

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile / Test + Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # src/ only: the protected analysis tree and sonar.sources hold src/, and
      # the LCOV validator rejects records outside that component prefix.
      - name: Test with coverage
        run: npx jest --coverage --coverageReporters=lcov --collectCoverageFrom='src/**/*.{ts,tsx}'
      - name: Upload coverage
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
