# Copy into a consumer repo as .github/workflows/sync-tooling.yml and set TOOLING_REPO.
# Weekly (or on demand) it re-runs `install.sh claude` from this tooling repo and opens one
# draft PR when anything changed. The install lock means files you edited stay yours.
# A PR opened with the default GITHUB_TOKEN does not start other workflows, so required
# checks would never run on it: give the job a GitHub App token as SYNC_TOKEN. Until then it
# falls back to GITHUB_TOKEN (needs "Allow GitHub Actions to create pull requests").
name: sync-tooling
on:
  schedule: [{cron: '17 6 * * 1'}]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: {group: sync-tooling, cancel-in-progress: false}
env:
  TOOLING_REPO: Concord-Voice/Agentic-Dev-Tooling
  BRANCH: chore/sync-tooling
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {token: '${{ secrets.SYNC_TOKEN || github.token }}'}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: '${{ env.TOOLING_REPO }}', path: .tooling, persist-credentials: false}
      - name: Install and propose
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          src="$(git -C .tooling rev-parse --short HEAD)"
          ./.tooling/install.sh claude --project .
          rm -rf .tooling
          git add -A .claude scripts/repo-config.sh
          if git diff --cached --quiet; then echo "already current"; exit 0; fi
          git switch -c "$BRANCH"
          git -c user.name='github-actions[bot]' -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
            commit -qm "chore: sync agentic tooling to $src"
          # The branch belongs to this job alone, so replacing it each run is safe.
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --draft --head "$BRANCH" --title "chore: sync agentic tooling" \
              --body "Re-ran install.sh claude from $TOOLING_REPO@$src. Files edited in this repo were skipped."
          fi
