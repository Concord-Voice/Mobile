// Android half of ConcordCrypto: Kotlin over the platform providers (AES-256-GCM,
// RSA-OAEP-4096/SHA-256), the same vendored Argon2 reference C over JNI, and Android
// Keystore storage. Keys never reach JS. See docs/plans/2026-11-04-android-crypto-port-design.md.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.concordvoice.crypto"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        externalNativeBuild { cmake { arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON" } }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.biometric:biometric:1.1.0")
    testImplementation("junit:junit:4.13.2")
}
