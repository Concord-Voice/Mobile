sonar.projectKey=Concord-Voice_Mobile
sonar.organization=concord-voice

# ── Narrowed scope (ADR-0017 / #1430) ────────────────────────────────────────
# SonarCloud owns COVERAGE + NEW-CODE QUALITY + AI-CODE-ASSURANCE only.
# Security-taint detection (injection-tagged vulnerability rules) is owned by
# CodeQL security-extended (codeql.yml) + Semgrep (semgrep.yml); the
# corresponding Sonar sensors are retired via quality-PROFILE deactivation
# (scripts/sonar/narrow-security-profiles.sh) — there is no scanner property
# for this, so nothing below configures it. Do NOT add rule-tuning properties
# here: prohibited by the AI-Code-Assurance policy.

# ── Source & Test Directories ────────────────────────────────────────────────
# The protected PR analysis tree copies only src/ and __tests__/
# (SOURCE_DIRS in scripts/sonar/prepare-protected-pr-analysis.py).
sonar.sources=src
# Jest suites live in both __tests__/ and src/__tests__/; the latter is
# excluded from sources below so it counts as test code, not production.
sonar.tests=__tests__,src/__tests__

# ── TypeScript Projects ──────────────────────────────────────────────────────
# tsconfig.json is in SUPPORT, so it also exists in the protected analysis tree.
sonar.typescript.tsconfigPaths=tsconfig.json

# ── Coverage Reports ─────────────────────────────────────────────────────────
# Written by build.yml's "Mobile / Test + Coverage" job (jest, src/ only).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Source Exclusions (completely ignored by all analysis) ────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  src/__tests__/**

# ── Duplication Exclusions (not counted toward duplication metrics) ───────────
sonar.cpd.exclusions=\
  __tests__/**,\
  src/__tests__/**

# ── Dependency Analysis (SCA) ────────────────────────────────────────────────
# Scan scope, not rule tuning. SCA runs only in the main-branch scan; the
# protected PR scan turns it off. The scan job holds SONAR_TOKEN, so SCA must
# not run build tools there.
# Resolving Gradle would run build scripts and need a JDK and Android SDK, so
# SCA reads the declared Gradle versions only (degraded mode).
sonar.sca.gradleNoResolve=true
# Do not run pip for .github/requirements-pyyaml.txt (hash-pinned CI tooling).
sonar.sca.pythonNoResolve=true
# Go resolution stays on for tools/sonar-caller-proof: it only fetches the
# modules named in go.mod and go.sum and runs no package code.
